name: SyncerD Git Sync

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync GitHub to AWS CodeCommit
        uses: clouddrove/syncerd@v0.2.2
        with:
          command: git-sync
          config: syncerd.yaml
          once: "true"
          dry-run: "true"
        env:
          SYNCERD_GIT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNCERD_GIT_CODECOMMIT_GIT_USERNAME: ${{ secrets.CODECOMMIT_GIT_USERNAME }}
          SYNCERD_GIT_CODECOMMIT_GIT_PASSWORD: ${{ secrets.CODECOMMIT_GIT_PASSWORD }}