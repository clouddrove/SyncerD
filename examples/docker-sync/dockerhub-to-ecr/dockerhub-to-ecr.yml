# Set the ECR account and region before using this configuration.

source:
  type: dockerhub
  registry: docker.io

destinations:
  - name: my-ecr
    type: ecr
    registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
    region: us-east-1

images:
  - name: busybox
    tags:
      - uclibc

  - name: nginx
    tags:
      - latest

  - name: alpine
    tags:
      - latest