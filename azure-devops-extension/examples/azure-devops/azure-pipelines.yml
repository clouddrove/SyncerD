trigger: none
pr: none

parameters:
  - name: configPath
    displayName: SyncerD config path from repo
    type: string
    default: azure-devops-extension/examples/azure-devops/syncerd.azure.yaml.example
  - name: syncerdVersion
    displayName: SyncerD version
    type: string
    default: v0.0.11

pool:
  vmImage: ubuntu-latest

variables:
  - group: syncer-d
  - name: SYNCERD_STATE_PATH
    value: "$(Pipeline.Workspace)/.syncerd-state.json"

steps:
  - checkout: self

  - task: SyncerD@1
    displayName: Install SyncerD
    inputs:
      version: ${{ parameters.syncerdVersion }}
      command: ""

  - script: |
      set -euo pipefail
      sed "s|<acr-login-server>|$ACR_LOGIN_SERVER|g" \
        "$SYNCERD_CONFIG_PATH" \
        > "$(Pipeline.Workspace)/syncerd-test.yaml"
    displayName: Prepare SyncerD test config
    env:
      ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
      SYNCERD_CONFIG_PATH: ${{ parameters.configPath }}

  - script: |
      set -euo pipefail
      echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" --username "$ACR_USERNAME" --password-stdin
    displayName: Login to Azure Container Registry
    env:
      ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
      ACR_USERNAME: $(ACR_USERNAME)
      ACR_PASSWORD: $(ACR_PASSWORD)

  - script: syncerd --help
    displayName: Verify SyncerD is on PATH

  - script: syncerd sync --config "$(Pipeline.Workspace)/syncerd-test.yaml" --once=true
    displayName: Sync Docker Hub image to ACR
    env:
      SYNCERD_STATE_PATH: $(SYNCERD_STATE_PATH)
