name: "SyncerD"
description: "Sync Docker images between registries, or mirror git repositories between hosting providers."
author: "CloudDrove"
branding:
  icon: "package"
  color: "blue"

inputs:
  command:
    description: "Subcommand to run: sync (Docker registry sync) or git-sync (git repository mirroring)"
    required: false
    default: "sync"
  config:
    description: "Path to syncerd.yaml"
    required: false
    default: "syncerd.yaml"
  once:
    description: "Run once and exit (true/false)"
    required: false
    default: "true"

runs:
  using: "docker"
  # Marketplace best practice: pin to a major tag (v1).
  # The release workflow publishes ghcr.io/clouddrove/syncerd:v1.
  image: "docker://ghcr.io/clouddrove/syncerd:v1"
  args:
    - "${{ inputs.command }}"
    - "--config"
    - "${{ inputs.config }}"
    - "--once=${{ inputs.once }}"
