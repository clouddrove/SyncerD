{{- if and (not .Values.existingSecret) (or .Values.secret.dockerhubUsername .Values.secret.dockerhubToken .Values.secret.slackWebhookUrl .Values.secret.gitTokens .Values.secret.gitCredentials) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncerd.fullname" . }}-credentials
  labels:
    {{- include "syncerd.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.dockerhubUsername }}
  SYNCERD_SOURCE_USERNAME: {{ .Values.secret.dockerhubUsername | quote }}
  {{- end }}
  {{- if .Values.secret.dockerhubPassword }}
  SYNCERD_SOURCE_PASSWORD: {{ .Values.secret.dockerhubPassword | quote }}
  {{- end }}
  {{- if .Values.secret.dockerhubToken }}
  SYNCERD_SOURCE_TOKEN: {{ .Values.secret.dockerhubToken | quote }}
  {{- end }}
  {{- if .Values.secret.slackWebhookUrl }}
  SYNCERD_SLACK_WEBHOOK_URL: {{ .Values.secret.slackWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.secret.slackChannel }}
  SYNCERD_SLACK_CHANNEL: {{ .Values.secret.slackChannel | quote }}
  {{- end }}
  {{- range $name, $token := .Values.secret.gitTokens }}
  {{- $key := upper (regexReplaceAll "[^a-zA-Z0-9]" $name "_") }}
  SYNCERD_GIT_{{ $key }}_TOKEN: {{ $token | quote }}
  {{- end }}
  {{- range $name, $cred := .Values.secret.gitCredentials }}
  {{- $key := upper (regexReplaceAll "[^a-zA-Z0-9]" $name "_") }}
  {{- if $cred.username }}
  SYNCERD_GIT_{{ $key }}_GIT_USERNAME: {{ $cred.username | quote }}
  {{- end }}
  {{- if $cred.password }}
  SYNCERD_GIT_{{ $key }}_GIT_PASSWORD: {{ $cred.password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
