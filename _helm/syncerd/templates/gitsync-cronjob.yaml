{{- if .Values.gitSync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "syncerd.fullname" . }}-gitsync
  labels:
    {{- include "syncerd.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.gitSync.schedule | quote }}
  concurrencyPolicy: {{ .Values.gitSync.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.gitSync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.gitSync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "syncerd.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: {{ .Values.gitSync.restartPolicy }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.serviceAccount.create }}
          serviceAccountName: {{ include "syncerd.fullname" . }}
          {{- else if .Values.serviceAccount.name }}
          serviceAccountName: {{ .Values.serviceAccount.name | quote }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          containers:
            - name: syncerd-gitsync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /app/syncerd
                - git-sync
                - --config
                - /config/syncerd.yaml
                - --once
              env:
                {{- if .Values.existingSecret }}
                - name: SYNCERD_SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret | quote }}
                      key: SYNCERD_SLACK_WEBHOOK_URL
                      optional: true
                - name: SYNCERD_SLACK_CHANNEL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret | quote }}
                      key: SYNCERD_SLACK_CHANNEL
                      optional: true
                {{- range .Values.gitSync.providers }}
                {{- $key := upper (regexReplaceAll "[^a-zA-Z0-9]" .name "_") }}
                - name: SYNCERD_GIT_{{ $key }}_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.existingSecret | quote }}
                      key: SYNCERD_GIT_{{ $key }}_TOKEN
                      optional: true
                {{- end }}
                {{- else if or .Values.secret.dockerhubUsername .Values.secret.dockerhubToken .Values.secret.slackWebhookUrl .Values.secret.gitTokens .Values.gitSync.providers }}
                - name: SYNCERD_SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "syncerd.fullname" . }}-credentials
                      key: SYNCERD_SLACK_WEBHOOK_URL
                      optional: true
                - name: SYNCERD_SLACK_CHANNEL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "syncerd.fullname" . }}-credentials
                      key: SYNCERD_SLACK_CHANNEL
                      optional: true
                {{- $secretName := printf "%s-credentials" (include "syncerd.fullname" .) }}
                {{- range .Values.gitSync.providers }}
                {{- $key := upper (regexReplaceAll "[^a-zA-Z0-9]" .name "_") }}
                - name: SYNCERD_GIT_{{ $key }}_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: SYNCERD_GIT_{{ $key }}_TOKEN
                      optional: true
                {{- end }}
                {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                {{- if .Values.gitSync.persistence.enabled }}
                - name: gitcache
                  mountPath: /gitdata
                {{- end }}
              resources:
                {{- toYaml .Values.gitSync.resources | nindent 16 }}
          volumes:
            - name: config
              configMap:
                name: {{ include "syncerd.fullname" . }}-config
            {{- if .Values.gitSync.persistence.enabled }}
            - name: gitcache
              persistentVolumeClaim:
                claimName: {{ include "syncerd.fullname" . }}-gitcache
            {{- end }}
{{- end }}
