# Default values for syncerd.
# See README and syncerd.yaml.example for full config reference.

# Image to run
image:
  repository: ghcr.io/clouddrove/syncerd
  tag: latest
  pullPolicy: IfNotPresent

# Kubernetes CronJob schedule (when to run sync). Default: every 3 weeks at midnight UTC
# https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
cronjob:
  # Set to false to disable the image sync CronJob entirely, e.g. for a
  # deployment that only wants gitSync mirroring. Defaults to true so
  # existing installs are unaffected.
  enabled: true
  schedule: "0 0 */21 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  restartPolicy: OnFailure

# State persistence (default: stateless, no PVC)
# - enabled: false → stateless; each run checks destination registry and skips existing tags (no PVC)
# - enabled: true  → persist state across runs for faster "already synced" checks
persistence:
  enabled: false
  size: 1Gi
  # storageClass: ""  # use cluster default if not set

# Git repository mirroring (syncerd git-sync). Default: disabled.
# Mirrors repositories between GitHub and GitLab in either direction.
# Runs as its own CronJob so it can keep a different cadence from image sync.
gitSync:
  enabled: false

  # Repo mirroring is usually far more frequent than image sync.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  restartPolicy: OnFailure

  # The clone cache and the mirror state MUST share a volume. Losing state
  # while keeping the cache makes every repository fail the adopt guard on
  # the next run, because SyncerD no longer knows it populated those
  # destinations itself. Both paths below sit under the same mount.
  #
  # enabled: false mounts an emptyDir instead of a PVC, so workDir and
  # statePath stay valid and writable, but nothing survives past the run.
  # This is for one-shot testing only: every run after the first starts with
  # an empty cache and no state, so it re-clones everything and then fails
  # the adopt guard on every destination it already populated, until adopt
  # is set. Leave this enabled for any schedule you intend to keep running.
  persistence:
    enabled: true
    size: 10Gi
    # storageClass: ""  # use cluster default if not set
  workDir: /gitdata/cache
  statePath: /gitdata/cache/git-state.json

  # Parallel repository mirrors per run.
  concurrency: 4

  # Named providers. token, git_username, and git_password are secrets:
  # set them in the secret block (gitTokens / gitCredentials) or via
  # existingSecret, never here. A token, git_username, or git_password set
  # on a provider entry in this values file is silently ignored, since the
  # ConfigMap never carries those fields; the run then fails later with a
  # confusing "token is required" error.
  # The env var name is derived from the provider name, upper cased with
  # non alphanumeric characters replaced by underscore, so a provider named
  # "gh" reads SYNCERD_GIT_GH_TOKEN (and, if needed, SYNCERD_GIT_GH_GIT_USERNAME
  # / SYNCERD_GIT_GH_GIT_PASSWORD for CodeCommit's static credential fallback).
  providers: []
  # Example, all five supported provider types:
  # providers:
  #   - name: gh
  #     type: github
  #     owner: my-org
  #   - name: gl
  #     type: gitlab
  #     owner: my-group
  #   - name: bb
  #     type: bitbucket
  #     owner: my-workspace
  #     email: svc@example.com  # required: API tokens authenticate with the account email
  #   - name: ado
  #     type: azuredevops
  #     owner: my-ado-org
  #     project: my-ado-project  # required: repositories live inside a project
  #     # auth: entra           # default is "pat"; "entra" presents an operator supplied Entra ID access token
  #   - name: cc
  #     type: codecommit
  #     region: us-east-1  # required; CodeCommit has no owner, repository names are flat within an account and region
  #     # git_username / git_password: static IAM HTTPS Git credentials, needed because SyncerD does not derive
  #     # SigV4 git credentials; set via secret.gitCredentials or existingSecret, never here

  mirrors: []
  # Example:
  # mirrors:
  #   - name: gh-to-gl
  #     source: gh
  #     destination: gl
  #     filters:
  #       include: ["terraform-*"]
  #       skip_archived: true
  #       skip_forks: true
  #     create_missing: true
  #     visibility: private
  #     push_mode: mirror

  # Cloning real repositories needs more headroom than image sync.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

# SyncerD config (maps to syncerd.yaml)
# Source: Docker Hub
config:
  source:
    type: dockerhub
    registry: docker.io
    # username/password/token: set via secret (see below) or env
  destinations: []
  # Example:
  # destinations:
  #   - name: my-ecr
  #     type: ecr
  #     registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
  #     region: us-east-1
  images: []
  # Example:
  # images:
  #   - name: library/nginx
  #     watch_tags: true
  state_path: /data/.syncerd-state.json
  fail_fast: false
  slack:
    enabled: false
    notify_on_new: true
    notify_on_error: true
    message_format: compact

# Optional: use existing Secret for credentials (avoids storing in values)
# Create a secret with keys: DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD or DOCKERHUB_TOKEN;
# optional: SYNCERD_SLACK_WEBHOOK_URL, SYNCERD_SLACK_CHANNEL
existingSecret: ""
# Or provide inline (not recommended for production - use existingSecret)
secret:
  dockerhubUsername: ""
  dockerhubPassword: ""
  dockerhubToken: ""
  slackWebhookUrl: ""
  slackChannel: ""
  # Git provider tokens, keyed by provider name. Prefer existingSecret.
  # gitTokens:
  #   gh: "ghp_..."
  #   gl: "glpat-..."
  gitTokens: {}
  # Git HTTPS credential pairs, keyed by provider name. This is CodeCommit's
  # intended git transport credential: SyncerD does not derive SigV4 git
  # credentials, so a static IAM HTTPS Git credential pair is how a
  # CodeCommit provider authenticates git push and clone, even when the API
  # half authenticates via IRSA or an instance role. Prefer existingSecret.
  # gitCredentials:
  #   cc:
  #     username: "..."
  #     password: "..."
  gitCredentials: {}

# imagePullSecrets: secrets used to pull the syncerd image itself (e.g. from a private registry).
# This is separate from dockerConfigSecret which is for destination registry auth.
# Example:
#   imagePullSecrets:
#     - name: ghcr-pull-secret
imagePullSecrets: []

# dockerConfigSecret: name of a Secret containing a Docker config for destination registry auth
# (ECR, ACR, GCR, GHCR). Must have a .dockerconfigjson key.
# Create: kubectl create secret generic syncerd-docker-config \
#   --from-file=.dockerconfigjson=$HOME/.docker/config.json \
#   --type=kubernetes.io/dockerconfigjson
# Note: ECR tokens expire every 12h; refresh this secret before expiry.
dockerConfigSecret: ""

# Resource limits for the sync job
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Service account
serviceAccount:
  create: true
  name: ""
  # Annotations on the created service account. Use this for IRSA when syncing
  # to ECR, e.g.
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/syncerd
  annotations: {}
