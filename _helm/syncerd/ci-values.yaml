# Minimal values for CI (helm template validation)
config:
  destinations:
    - name: my-ecr
      type: ecr
      registry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      region: us-east-1
  images:
    - name: library/nginx
      watch_tags: true

gitSync:
  enabled: true
  providers:
    - name: gh
      type: github
      owner: my-org
    - name: gl
      type: gitlab
      owner: my-group
  mirrors:
    - name: gh-to-gl
      source: gh
      destination: gl
      filters:
        include: ["terraform-*"]
        skip_archived: true
        skip_forks: true
      create_missing: true
      visibility: private
      push_mode: mirror
